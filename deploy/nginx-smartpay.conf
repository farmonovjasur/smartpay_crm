server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /var/www/smartpay/frontend/dist;
    index index.html;

    # ─── API so'rovlari → Symfony PHP-FPM ───
    location ~ ^/api(/|$) {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/smartpay/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT  /var/www/smartpay/backend/public;
        fastcgi_param REQUEST_URI    $request_uri;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ─── index.html keshlamaslik ───
    # Har doim serverdan yangi index.html yuklash (yangi build hash'lari uchun)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ─── Static assets keshi (hash nomlari bor, xavfsiz) ───
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Boshqa static fayllar ───
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ─── SPA fallback ───
    # React Router uchun: mavjud bo'lmagan yo'llarni index.html ga qaytarish
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ─── PHP fayllarni to'g'ridan-to'g'ri ochishni taqiqlash ───
    location ~ \.php$ {
        return 404;
    }

    # ─── Yashirin fayllarni taqiqlash ───
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
