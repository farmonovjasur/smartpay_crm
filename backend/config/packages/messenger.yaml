framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Debt reconciliation — async so it never blocks HTTP requests
            'App\Message\ReconcileDebtsAsync': async
            'App\Message\DailyDebtCheck': async
            'App\Message\CleanExpiredTokens': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
